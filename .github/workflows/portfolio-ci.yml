name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  balyvo-apk:
    name: Balyvo Android APK
    if: github.head_ref == 'balyvo-apk-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate local hero exact bytes
        run: |
          cat \
            balyvo-android/app/src/main/res/raw/hero_a.txt \
            balyvo-android/app/src/main/res/raw/hero_b.txt \
            balyvo-android/app/src/main/res/raw/hero_c.txt \
            balyvo-android/app/src/main/res/raw/hero_d.txt \
            balyvo-android/app/src/main/res/raw/hero_e.txt \
            balyvo-android/app/src/main/res/raw/hero_f.txt \
            | base64 -d > /tmp/balyvo-hero-source.jpg
          echo 'e1a5b57b5a36ca76c2ecdb0da43aa762ea5ee0b63e8a10b402ce13264aaf1758  /tmp/balyvo-hero-source.jpg' | sha256sum -c -
          file /tmp/balyvo-hero-source.jpg | tee /tmp/hero-file.txt
          grep -q 'JPEG image data' /tmp/hero-file.txt
          grep -q '480x853' /tmp/hero-file.txt
      - name: Validate sharing source
        run: |
          grep -q 'class MainActivityV5' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'Compartilhar Balyvo' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'Compartilhar meu progresso' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'Peso e IMC ficam desmarcados' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'FileProvider.getUriForFile' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'Meta de água atingida' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'badge.setText("VIDA REAL")' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV41.java
          grep -q 'build.setVisibility(View.GONE)' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV41.java
          grep -q 'androidx.core.content.FileProvider' balyvo-android/app/src/main/AndroidManifest.xml
          grep -q 'cache-path name="share"' balyvo-android/app/src/main/res/xml/file_paths.xml
      - name: Build unsigned release APK
        working-directory: balyvo-android
        run: gradle :app:assembleRelease --stacktrace
      - name: Align and validate update-test APK
        run: |
          RAW="$GITHUB_WORKSPACE/balyvo-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/balyvo-android/app/build/outputs/apk/release/Balyvo-Android-v0.5.1-UPDATE-TEST-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$ALIGNED"
          unzip -t "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ALIGNED" | tee /tmp/balyvo-badging.txt
          grep -q "package: name='app.balyvo.mobile'" /tmp/balyvo-badging.txt
          grep -q "versionCode='10'" /tmp/balyvo-badging.txt
          grep -q "versionName='0.5.1-update-test'" /tmp/balyvo-badging.txt
          grep -q "launchable-activity: name='app.balyvo.mobile.MainActivityV5'" /tmp/balyvo-badging.txt
          test -s "$ALIGNED"
      - name: Stage update-test APK
        run: |
          mkdir -p balyvo-android/output
          cp balyvo-android/app/build/outputs/apk/release/Balyvo-Android-v0.5.1-UPDATE-TEST-UNSIGNED.apk balyvo-android/output/
          sha256sum balyvo-android/output/Balyvo-Android-v0.5.1-UPDATE-TEST-UNSIGNED.apk > balyvo-android/output/UPDATE-TEST-SHA256.txt
      - name: Upload update-test build
        uses: actions/upload-artifact@v4
        with:
          name: Balyvo-Android-v0.5.1-update-test-unsigned
          path: |
            balyvo-android/output/Balyvo-Android-v0.5.1-UPDATE-TEST-UNSIGNED.apk
            balyvo-android/output/UPDATE-TEST-SHA256.txt
          retention-days: 2
