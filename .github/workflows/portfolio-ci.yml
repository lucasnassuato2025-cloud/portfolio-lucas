name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  balyvo-apk:
    name: Balyvo Android APK
    if: github.head_ref == 'balyvo-apk-build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate local hero exact bytes
        run: |
          cat \
            balyvo-android/app/src/main/res/raw/hero_a.txt \
            balyvo-android/app/src/main/res/raw/hero_b.txt \
            balyvo-android/app/src/main/res/raw/hero_c.txt \
            balyvo-android/app/src/main/res/raw/hero_d.txt \
            balyvo-android/app/src/main/res/raw/hero_e.txt \
            balyvo-android/app/src/main/res/raw/hero_f.txt \
            | base64 -d > /tmp/balyvo-hero-source.jpg
          echo 'e1a5b57b5a36ca76c2ecdb0da43aa762ea5ee0b63e8a10b402ce13264aaf1758  /tmp/balyvo-hero-source.jpg' | sha256sum -c -
          file /tmp/balyvo-hero-source.jpg | tee /tmp/hero-file.txt
          grep -q 'JPEG image data' /tmp/hero-file.txt
          grep -q '480x853' /tmp/hero-file.txt
      - name: Validate sharing, brand and monetization source
        run: |
          grep -q 'class MainActivityV5' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'R.drawable.ic_balyvo' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          ! grep -q 'drawText("B"' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV5.java
          grep -q 'class MainActivityV6' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q 'balyvo_pro_monthly' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q 'LOCAL_TRIAL=5L\*DAY' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q 'P5D' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q 'installedFromPlay' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q 'Começar 5 dias grátis' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q 'A cobrança real será ativada na versão da Google Play' balyvo-android/app/src/main/java/app/balyvo/mobile/MainActivityV6.java
          grep -q "com.android.billingclient:billing:9.1.0" balyvo-android/app/build.gradle
          grep -q 'androidx.core.content.FileProvider' balyvo-android/app/src/main/AndroidManifest.xml
          grep -q 'cache-path name="share"' balyvo-android/app/src/main/res/xml/file_paths.xml
      - name: Build unsigned release APK
        working-directory: balyvo-android
        run: gradle :app:assembleRelease --stacktrace
      - name: Align and validate unsigned APK
        run: |
          RAW="$GITHUB_WORKSPACE/balyvo-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/balyvo-android/app/build/outputs/apk/release/Balyvo-Android-v0.6.0-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$ALIGNED"
          unzip -t "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ALIGNED" | tee /tmp/balyvo-badging.txt
          grep -q "package: name='app.balyvo.mobile'" /tmp/balyvo-badging.txt
          grep -q "versionCode='11'" /tmp/balyvo-badging.txt
          grep -q "versionName='0.6.0'" /tmp/balyvo-badging.txt
          grep -q "launchable-activity: name='app.balyvo.mobile.MainActivityV6'" /tmp/balyvo-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$ALIGNED" | tee /tmp/balyvo-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/balyvo-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$ALIGNED" AndroidManifest.xml | tee /tmp/balyvo-manifest.txt
          grep -q 'androidx.core.content.FileProvider' /tmp/balyvo-manifest.txt
          unzip -l "$ALIGNED" | grep -q 'classes.dex'
          test -s "$ALIGNED"
      - name: Stage unsigned APK
        run: |
          mkdir -p balyvo-android/output
          cp balyvo-android/app/build/outputs/apk/release/Balyvo-Android-v0.6.0-UNSIGNED.apk balyvo-android/output/
          sha256sum balyvo-android/output/Balyvo-Android-v0.6.0-UNSIGNED.apk > balyvo-android/output/UNSIGNED-SHA256.txt
      - name: Upload Balyvo unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Balyvo-Android-v0.6.0-unsigned
          path: |
            balyvo-android/output/Balyvo-Android-v0.6.0-UNSIGNED.apk
            balyvo-android/output/UNSIGNED-SHA256.txt
          retention-days: 7
