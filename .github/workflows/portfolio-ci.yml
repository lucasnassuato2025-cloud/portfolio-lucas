name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  balyvo-apk:
    name: Balyvo Android APK
    if: github.head_ref == 'balyvo-apk-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        working-directory: balyvo-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mkdir -p balyvo-android/output
          cp balyvo-android/app/build/outputs/apk/debug/app-debug.apk balyvo-android/output/Balyvo-preview.apk
          sha256sum balyvo-android/output/Balyvo-preview.apk
          ls -lh balyvo-android/output/Balyvo-preview.apk
      - name: Upload Balyvo APK
        uses: actions/upload-artifact@v4
        with:
          name: Balyvo-preview-APK
          path: balyvo-android/output/Balyvo-preview.apk
          retention-days: 30
