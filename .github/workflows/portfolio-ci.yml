name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  balyvo-apk:
    name: Balyvo Android APK
    if: github.head_ref == 'balyvo-apk-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Balyvo signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/balyvo-android/balyvo-release.keystore" \
            -storepass balyvo-preview \
            -alias balyvo \
            -keypass balyvo-preview \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Balyvo Preview, OU=Balyvo, O=Balyvo, L=Guaruja, ST=SP, C=BR"
      - name: Build signed release APK
        working-directory: balyvo-android
        env:
          BALYVO_KEYSTORE: ${{ github.workspace }}/balyvo-android/balyvo-release.keystore
          BALYVO_STORE_PASSWORD: balyvo-preview
          BALYVO_KEY_ALIAS: balyvo
          BALYVO_KEY_PASSWORD: balyvo-preview
        run: gradle :app:assembleRelease --stacktrace
      - name: Validate APK for Android installation and redesign
        run: |
          APK="$GITHUB_WORKSPACE/balyvo-android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/balyvo-badging.txt
          grep -q "package: name='app.balyvo.mobile'" /tmp/balyvo-badging.txt
          grep -q "versionName='0.3.1-preview'" /tmp/balyvo-badging.txt
          grep -q "launchable-activity: name='app.balyvo.mobile.MainActivityV31'" /tmp/balyvo-badging.txt
          unzip -p "$APK" classes.dex | strings > /tmp/balyvo-strings.txt
          grep -q "VISUAL NOVO ATIVO" /tmp/balyvo-strings.txt
          grep -q "Boas escolhas hoje" /tmp/balyvo-strings.txt
          HERO_PATH=$(unzip -Z1 "$APK" | grep -E '^res/.*\.b64$' | head -1)
          test -n "$HERO_PATH"
          unzip -p "$APK" "$HERO_PATH" | base64 -d > /tmp/balyvo-hero.jpg
          test $(stat -c%s /tmp/balyvo-hero.jpg) -gt 4000
          file /tmp/balyvo-hero.jpg | grep -q 'JPEG image data'
      - name: Stage APK
        run: |
          mkdir -p balyvo-android/output
          cp balyvo-android/app/build/outputs/apk/release/app-release.apk balyvo-android/output/Balyvo-Android-v0.3.1.apk
          sha256sum balyvo-android/output/Balyvo-Android-v0.3.1.apk | tee balyvo-android/output/SHA256.txt
          ls -lh balyvo-android/output/Balyvo-Android-v0.3.1.apk
      - name: Upload Balyvo APK
        uses: actions/upload-artifact@v4
        with:
          name: Balyvo-Android-v0.3.1
          path: |
            balyvo-android/output/Balyvo-Android-v0.3.1.apk
            balyvo-android/output/SHA256.txt
          retention-days: 30
