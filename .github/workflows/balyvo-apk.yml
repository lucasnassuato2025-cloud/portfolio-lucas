name: Build Balyvo APK

on:
  push:
    branches: [balyvo-apk-build]
    paths-ignore:
      - 'balyvo-android/output/Balyvo-preview.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: balyvo-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p balyvo-android/output
          cp balyvo-android/app/build/outputs/apk/debug/app-debug.apk balyvo-android/output/Balyvo-preview.apk
          ls -lh balyvo-android/output/Balyvo-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Balyvo-preview-APK
          path: balyvo-android/output/Balyvo-preview.apk
          retention-days: 30

      - name: Publish APK on build branch
        run: |
          git config user.name 'Balyvo Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f balyvo-android/output/Balyvo-preview.apk
          git commit -m 'build(balyvo): APK instalável [skip ci]' || exit 0
          git push origin HEAD:balyvo-apk-build
