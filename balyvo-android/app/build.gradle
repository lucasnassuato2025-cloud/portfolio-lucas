plugins {
    id 'com.android.application'
}

android {
    namespace 'app.balyvo.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.balyvo.mobile'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.6.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8+ já incorpora as extensões jdk7/jdk8 no stdlib principal.
// Dependências antigas ainda puxavam os artefatos 1.6.21 separados e causavam
// classes duplicadas quando o Google Play Billing 9.1.0 entrou no projeto.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
